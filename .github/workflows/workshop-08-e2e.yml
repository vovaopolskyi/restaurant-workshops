name: Workshop 08 end-to-end tests

on:
  push:
    branches: [main, feature/workshop-08-e2e]
    paths:
      - 'aqa/restaurant-aqa-framework/**'
      - '.github/workflows/workshop-08-e2e.yml'
  pull_request:
    paths:
      - 'aqa/restaurant-aqa-framework/**'
      - '.github/workflows/workshop-08-e2e.yml'
  workflow_dispatch:
    inputs:
      level:
        description: Scenario level to run
        required: true
        default: all
        type: choice
        options: [all, L1, L2, L3]
      run_live:
        description: Allow tests to create and clean up data in the configured test deployment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: aqa/restaurant-aqa-framework

jobs:
  validate:
    name: Validate framework without deployment credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      RUN_LIVE_E2E: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: aqa/restaurant-aqa-framework/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run check
      - name: Discover tests without running them
        run: |
          mkdir -p test-results
          npm run test:list | tee test-results/discovered-tests.txt
      - name: Upload discovery output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-08-test-discovery
          path: aqa/restaurant-aqa-framework/test-results/
          if-no-files-found: ignore
          retention-days: 7

  live-e2e:
    name: Run against the configured test deployment
    needs: validate
    # PR code never receives test credentials or permission to mutate a deployment.
    if: >-
      github.event_name != 'pull_request' &&
      vars.RUN_LIVE_E2E == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_live)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: aqa-e2e
    concurrency:
      group: workshop-08-live-deployment
      cancel-in-progress: false
    env:
      CI: 'true'
      RUN_LIVE_E2E: 'true'
      BASE_URL: ${{ vars.BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TEST_TABLE_ID: ${{ vars.TEST_TABLE_ID }}
      TEST_TABLE_IDS: ${{ vars.TEST_TABLE_IDS }}
      TEST_LOCATION_ID: ${{ vars.TEST_LOCATION_ID }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      OTHER_EMAIL: ${{ secrets.OTHER_EMAIL }}
      OTHER_PASSWORD: ${{ secrets.OTHER_PASSWORD }}
      WAITER_EMAIL: ${{ secrets.WAITER_EMAIL }}
      WAITER_PASSWORD: ${{ secrets.WAITER_PASSWORD }}
      ENABLE_ADMIN_FIXTURES: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: aqa/restaurant-aqa-framework/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check required deployment configuration
        run: |
          for name in BASE_URL API_BASE_URL TEST_TABLE_ID TEST_LOCATION_ID OWNER_EMAIL OWNER_PASSWORD OTHER_EMAIL OTHER_PASSWORD WAITER_EMAIL WAITER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. Configure the repository variables or secrets before running live tests."
              exit 1
            fi
          done
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run all requested scenarios
        id: scenarios
        continue-on-error: true
        env:
          REQUESTED_LEVEL: ${{ inputs.level || 'all' }}
        run: |
          case "$REQUESTED_LEVEL" in
            all) npm test ;;
            L1) npm run test:l1 ;;
            L2) npm run test:l2 ;;
            L3) npm run test:l3 ;;
            *) echo "::error::Unsupported scenario level"; exit 1 ;;
          esac
      - name: Upload HTML report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-08-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            aqa/restaurant-aqa-framework/playwright-report/
            aqa/restaurant-aqa-framework/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve test failure after publishing artifacts
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.scenarios.outcome }}
        run: |
          if [ "$TEST_OUTCOME" != 'success' ]; then
            echo "::error::Live tests failed or could not run. Review the preceding steps and uploaded artifacts."
            exit 1
          fi
